rule:
  meta:
    name: reference anti-LLM analysis strings
    namespace: anti-analysis
    authors:
      - corkami@google.com
    description: detects prompt injection strings, chat template markers, or directives designed to evade or manipulate automated LLM-based binary analysis and triage
    scopes:
      static: file
      dynamic: file
    att&ck:
      - Defense Evasion::Virtualization/Sandbox Evasion [T1497]
    mbc:
      - Anti-Behavioral Analysis::Virtual Machine Detection [B0009]
    references:
      - https://github.com/mandiant/capa-rules/issues/1204
    examples:
      - 82d56c616d20b9a68e778a14f3afd20425e6d5c12e80826caa32995727b3de9c  # fixture_b138d5ee_nim_decoy_1.exe_ mimicking b138d5ee95f29152de5c3e8f5c4a0eabd591e3cde42d988e664592ad7cd69968
      - 2dba256522c25a452e26c74ce1bcb333c7c75b657f6bf1a92c12116817b8a597  # fixture_6e47ea84_nim_decoy_2.exe_ mimicking 6e47ea8431ecb9662bc00a460fc10e9640e90844ab2af5b1da8178b68d426404
      - 6663f5cbe177e4e4cdc21ca115b9b06402a6c9be52c7dc21e97ce15b754d79cd  # fixture_f971090d_nim_decoy_3.exe_ mimicking f971090dc258236b807df98012ff270d7aae400b03d659d20b5e79a1c892d082
      - bc6768c5a78076b824461618e7eff28dee3b30d3f2377fcb03ba4a469a6ee4c2  # fixture_4647a0f7_glint_py.exe_ mimicking 4647a0f750b42a3b2bb0c3e3daadb75a2eb9bb2bdfb7a96f5ed14ac395a831e5
      - c71e0a6387735d2f782180a1b392d33782cb540bd215f80c374422d44da4c149  # fixture_985e3b97_ironheights_js.exe_ mimicking 985e3b977d59382b6855689925b594f0e3ce95b6a3285fae9d0c5db4ece3d79e
  features:
    - or:
      # direct instruction overrides
      - string: /(ignore|disregard|forget)\s+(all\s+|any\s+|every\s+|your\s+)?(previous|prior)\s+(instruction|directive|rule)/i
      - string: /disregard\s+(your\s+)?(system\s+prompt|safety\s+rule)/i
      - string: /you\s+are\s+now\s+in\s+(developer|maintenance|god)\s+mode/i

      # chat template token spraying
      - string: /<\|im_start\|>system/i
      - string: /<\|start_header_id\|>system<\|end_header_id\|>/i
      - string: /\[INST\][\s\S]{0,100}\[\/INST\]/i
      - string: /<<SYS>>[\s\S]{0,100}<<\/SYS>>/i

      # triage manipulation and directive headers
      - string: /###\s*system\s*(message|directive)/i
      - string: /(output|verdict)\s*(only\s*this\s*line)?\s*:\s*(benign|clean)/i
      - string: /(note\s+to\s+ai\s+reviewer|system\s+directive\s+to\s+analyst\s+model|to\s+the\s+llm\s+review)/i
