rule:
  meta:
    name: decrypt shellcode using IPV6
    namespace: load-code/shellcode
    authors:
      - corkami@google.com
    scopes:
      static: file
      dynamic: file
    examples:
      - 48bada9bc9759492da3944645fbe3bc6
      - 664b85996b069b0698c6ae8c8c0d3ce4
  features:
    - and:
      - string: "RtlIpv6StringToAddressA"
      - or:
        - string: "4D5A:9000:0300:0000:0400:0000:FFFF:0000"
        - string: "5648:89E6:4883:E4F0:4883:EC20:E80F:0000"
