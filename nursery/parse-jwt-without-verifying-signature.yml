rule:
  meta:
    name: parse JWT without verifying signature
    namespace: communication/http
    authors:
      - shishir-cyber
    scopes:
      static: function
      dynamic: unsupported
    att&ck:
      - Defense Evasion::Obfuscated Files or Information [T1027]
    references:
      - https://attack.mitre.org/techniques/T1027/
    examples: []
  features:
    - and:
      - string: /eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/
      - or:
        - string: /base64/
        - string: /decode/
        - string: /split/
      - not:
        - or:
          - string: /verify/
          - string: /signature/
          - string: /validate/
